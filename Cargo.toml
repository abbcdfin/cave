[package]
name = "cave"
version = "0.1.0"
edition = "2024"
description = "Transparent sandbox runner for coding agents in YOLO mode"
license = "MIT"
repository = "https://github.com/abbcdfin/cave"
homepage = "https://github.com/abbcdfin/cave"
readme = "README.md"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
libc = "0.2"

[dev-dependencies]
tempfile = "3.10"
