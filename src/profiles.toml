[defaults]
ro_system = [
    "/usr",
    "/etc",
    "/var",
    "/sys",
    "/bin",
    "/sbin",
    "/lib",
    "/lib64",
    "/lib32",
    "/opt"
]
ro_home = [
    ".local/bin",
    ".cargo/bin",
    ".rustup",
    ".gitconfig",
    ".local/share/uv",
    ".ssh/config",
    ".ssh/known_hosts"
]
rw_cache = [
    ".cache",
    ".cargo/registry",
    ".cargo/git",
    ".npm"
]
tmpfs = [
    "/tmp",
    "/run",
    "/var/tmp",
    "/etc/ssh/ssh_config.d"
]

[profiles.claude]
runtime = [
    ".local/share/claude"
]

[[profiles.claude.state]]
path = ".claude"
kind = "dir"

[[profiles.claude.state]]
path = ".claude.json"
kind = "file"
init = "{}"

[profiles.agy]
runtime = []

[[profiles.agy.state]]
path = ".gemini"
kind = "dir"

[profiles.aider]
runtime = [
    ".aider.conf.yml"
]

[[profiles.aider.state]]
path = ".aider"
kind = "dir"

[profiles.sh]
runtime = []
state = []

[profiles.bash]
runtime = []
state = []

[profiles.zsh]
runtime = []
state = []

[toolchains.flutter]
requires = [
    "${bin:flutter}"
]
rw_cache = [
    "${bin:flutter}/../..",
    ".pub-cache",
    ".gradle/caches",
    ".gradle/wrapper",
    ".dartServer"
]
runtime = [
    "${ANDROID_HOME:-Android/Sdk}",
    ".android/debug.keystore",
    ".config/flutter"
]
check_tcp = [
    { addr = "127.0.0.1:5037", hint = "start the host adb server: ADB_REJECT_KILL_SERVER=1 adb start-server" }
]


