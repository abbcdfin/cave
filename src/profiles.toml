[defaults]
ro_system = [
    "/usr",
    "/etc",
    "/var",
    "/sys",
    "/bin",
    "/sbin",
    "/lib",
    "/lib64",
    "/lib32",
    "/opt"
]
ro_home = [
    ".local/bin",
    ".cargo/bin",
    ".rustup",
    ".gitconfig"
]
rw_cache = [
    ".cache",
    ".cargo/registry",
    ".cargo/git",
    ".npm"
]
tmpfs = [
    "/tmp",
    "/run",
    "/var/tmp"
]

[profiles.claude]
runtime = [
    ".local/share/claude"
]

[[profiles.claude.state]]
path = ".claude"
kind = "dir"

[[profiles.claude.state]]
path = ".claude.json"
kind = "file"
init = "{}"

[profiles.agy]
runtime = [
    ".gemini/antigravity-cli/bin"
]

[[profiles.agy.state]]
path = ".gemini"
kind = "dir"

[profiles.aider]
runtime = []

[[profiles.aider.state]]
path = ".aider"
kind = "dir"

[[profiles.aider.state]]
path = ".aider.conf.yml"
kind = "file"
init = ""

[[profiles.aider.state]]
path = ".aider.chat.history.md"
kind = "file"
init = ""

[[profiles.aider.state]]
path = ".aider.input.history"
kind = "file"
init = ""

[profiles.sh]
runtime = []
state = []

[profiles.bash]
runtime = []
state = []

[profiles.zsh]
runtime = []
state = []

